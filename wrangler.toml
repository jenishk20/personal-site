# Cloudflare Pages configuration.
#
# Bindings are declared here, not in the dashboard: once a wrangler.toml exists,
# Pages reads bindings from it and greys out the dashboard UI ("Bindings for this
# project are being managed through wrangler.toml").
#
# `name` must match the Pages project name, otherwise wrangler CLI commands
# target the wrong project.
#
# compatibility_date is pinned deliberately. Left unset, wrangler defaults to
# today's date, which can be newer than the workerd binary bundled with the
# installed wrangler and then fails to boot. Bump it when you upgrade wrangler.

name = "jenishkothari"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-01"

# Likes and view counts, read by functions/api/counters/[slug].js.
# Created with: npx wrangler kv namespace create COUNTERS
#
# This id is an account-scoped identifier, not a credential — using it still
# requires Cloudflare auth, which is why Cloudflare's own docs commit it.
#
# Deliberately production-only: preview deployments get no COUNTERS binding, so
# the endpoint returns 503 there and test traffic can't inflate real counts.
[[kv_namespaces]]
binding = "COUNTERS"
id = "2a330c8b5256416cbb69323de97ef15f"
